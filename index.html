  <script>
    $(document).ready(function() {
      const DECIMAL_SEP = '.';
      const THOUSANDS_SEP = ',';
      const DATE_ORDER = 0;

      const tableData_0 = [["H1.1 Monitor Regional Housing Needs Allocation and Pipeline projects","a)   Provide an annual report on housing production to the City Council each March, prior to submittal of the Annual Progress Report to HCD by April 1st. The report will include an assessment on the City’s RHNA progress and, as needed, identify additional sites to ensure ongoing compliance with “no net loss” provisions of State law.\n","12/31/2023","6th Cycle","Continuous","a) The City provides an annual report to the City Council on housing production as part of its approval of the Annual Progress Report. \n\nThe City continues to enforce the provisions of No Net Loss law through the planning application process. Projects are required to propose a net increase of units through redevelopment and provide replacement of any deed restricted low-income units.","This objective is completed on an ongoing basis throughout the 2023-2031 period. The City Council has reviewed the annual APR for 2023, 2024, and 2025 and the City has submitted the APR to HCD annually. The implementation plan dashboard can be viewed here: <a href>https://strivesanmateo.org/housing-element-implementation/</a>"],["H1.1 Monitor Regional Housing Needs Allocation and Pipeline projects","b)   Conduct a mid-cycle review of realistic capacity projections and pipeline project housing production to ensure outcomes are aligned with projections. Update sites inventory to include additional sites to ensure ongoing compliance with “no net loss” provisions of State law.","12/31/2027","6th Cycle","Not Yet Started","b) By 2027, additional sites for housing redevelopment will be identified, as necessary, to ensure that the City meets its share of RHNA requirements.","Not yet started."],["H1.2 Utilize Public Funding and Properties for New Affordable Housing","a)   Continue to set aside 20% of general fund property tax revenues from former RDA areas (aka \"Boomerang Funds”), as well as the Affordable Housing Commercial Linkage Fee Fund to use for affordable housing development, prioritizing funding allocation to projects that include units for extremely low income (ELI) households. \n\n","12/31/2023","6th Cycle","Continuous","a) The City continues to set aside 20% of general fund property tax revenues from former RDA areas in a dedicated housing fund to support affordable housing production, with a prioritization for ELI households.\n\n\n","This objective is completed on an ongoing basis throughout the 2023-2031 period. City operating budget for FY25-26. $1,000,000 added to the fund. https://www.cityofsanmateo.org/DocumentCenter/View/98388/Adopted-2025-26-Budget"],["H1.2 Utilize Public Funding and Properties for New Affordable Housing","b)   Identify ways to create a stand-alone Housing Trust Fund using available funding sources and utilizing that fund to leverage new funding sources, including the Bay Area Housing Finance Authority (BAHC) and the Bay Area Preservation Pilot (BAPP).","2025","6th Cycle","In Progress","b). Staff completed a preliminary review of Housing Trust Fund options in 2025. Staff is preparing a Housing Funds study session in 2026 to seek City Council input on a comprehensive funding strategy for City housing initiatives.","This objective is in progress."],["H1.2 Utilize Public Funding and Properties for New Affordable Housing","c)   Prioritize available local housing funds to assist in the production of at least 543 below market rate units by 2031, including within the study areas of the General Plan that allow high-density housing by holding developer roundtable meetings at least once per year. Encourage developers to include ELI units in their projects.","12/31/2023","6th Cycle","Completed","c) Construction of a new 225-unit affordable project (Kiku Crossing), which received a loan from Commercial Linkage Fee, former RDA, and other local funds, was completed and fully occupied in 2024. ","This objective is completed on an ongoing basis throughout the 2023-2031 period. The Kiku Crossing project is completed and occupied. The apartment building is managed by MidPen Housing. https://www.midpen-housing.org/property/kiku-crossing/"],["H1.2 Utilize Public Funding and Properties for New Affordable Housing","d)   Support development of 71 units of affordable housing on the City owned parking lot at 4th and Railroad as part of the public-private partnership (Bespoke project).        ","12/31/2024","6th Cycle","In Progress","d) Application review of a 71-unit affordable project on City-owned land at 4th and Railroad Ave. continued throughout 2025 as part of the Bespoke project, which includes a partnership between the City, an affordable housing developer, and a commercial developer to develop both affordable housing and commercial project. All units in the affordable project will be affordable to LI and VLI households.","In progress. The Exclusive Negotiation Agreement (ENA) for this project-- an agreement which allows for the applicant team and the City to continue negotiating legal agreements that include a Disposition, Development, and Loan Agreement, Development Agreement, and others, and to entitle the project --was extended through April 14, 2026. Item #15: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9565"],["H1.2 Utilize Public Funding and Properties for New Affordable Housing","e)\tSupport affordable housing development, including ELI units, on the City owned property at 4142 S. El Camino Real. \n","12/23/2023","6th Cycle","Continuous","e) The City will begin exploring options for producing new affordable housing units on the property at 4142 S El Camino Real in 2025.","This objective is completed on an ongoing basis throughout the 2023-2031 period."],["H1.3 Increase Affordable Housing Production","a)   Amend the Affordable Housing Ordinance (SMMC Chapter 27.16.050) and Inclusionary Housing Policy to allow for alternative compliance options to onsite inclusionary unit development within one year of Housing Element adoption. \n","12/31/2024","6th Cycle","Completed","a) The City made amendments/updates to its Affordable Housing Ordinance and Inclusionary Housing Policy/BMR Guidelines in June 2025 to allow for an offsite alternative compliance option or an applicant proposed alternative option to the on-site inclusionary unit development that meets certain provisions.\n","On June 16, 2025, the City Council adopted Resolution 72 (2025) to allow for the alternatives described. The Council meeting agenda can be found here: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9513 and the resolution can be found here: https://www.cityofsanmateo.org/DocumentCenter/View/99291"],["H1.3 Increase Affordable Housing Production","b)   Adopt an updated Density Bonus/Community Benefits program that provides additional incentives and/or streamlining options for housing projects that provide additional affordable units or the most needed unit types beyond minimum state requirements. Target ELI populations to the extent feasible.\n","12/31/2025","6th Cycle","Not Yet Started","b) The City anticipates incorporating policy options that incentivize additional affordable units or most-needed unit types as part of its comprehensive revision of the Inclusionary Housing Policy in 2026. ","None"],["H1.4 Support Increased Accessory Dwelling Unit Development","a)   Amend the City’s ADU Ordinance (SMMC Chapter 27.19) to align with current State law and to resolve any inconsistencies identified by HCD.\n\n\n\n\n","12/31/2024\n","6th Cycle","In Progress","a) On October 18, 2024 the City of San Mateo received a letter from HCD that detailed portions of the City's ADU Ordinance that it found to be inconsistent with state law. On November 15, 2024, the City sent a letter to HCD that responded to each of HCD's comments. On August 26, 2025, a Planning Commission study session was held to introduce ADU Ordinance updates and receive community and Commission feedback. The Planning Commission provided staff with feedback on specific local changes, outside of those required for State law compliance, in order to address community needs.Staff conducted outreach and hosted a virtual workshop on local ADU needs and requirements on September 25, 2025. On December 9, 2025, the Planning Commission held a public hearing to review the draft ADU Ordinance amendments and recommended City Council adoption. It is anticipated that the City Council will approve the ADU Ordinance in 2026.\n","The City Council is anticipated to consider the ADU ordinance in 2026."],["H1.4 Support Increased Accessory Dwelling Unit Development","b)   Maintain and expand the ADU information and resources available to home owners and applicants provided on the City’s website. ","12/31/2025","6th Cycle","Continuous","b) The City maintains an ADU resource website that provides current handouts and guidance on the City of San Mateo ADU regulations. The City's website is supplemented with the San Mateo County ADU Resource Center that the City sponsors.","This objective is completed on an ongoing basis throughout the 2023-2031 period. Extensive ADU information can be found on the City's website here: https://www.cityofsanmateo.org/3907\nThe City also sponsors the San Mateo County ADU Resource Center website that has additional information here: https://smcadu.org/"],["H1.4 Support Increased Accessory Dwelling Unit Development","c)   Collaborate with 21 Elements and other jurisdictions in San Mateo County to find ways to enhance available ADU resources, establish uniform standards and requirements, and effective ways to monitor ADU affordability. ","12/31/2025","6th Cycle","Continuous","c) Through 21 Elements, the City has joined with a County-wide effort to establish the San Mateo ADU Resource Center that launched in 2024 to support additional ADU construction and monitor affordability. Through this collaboration, 21 Elements worked with ABAG to establish a new ADU Rental Survey which was initiated in 2025. Also, the ADU Resource Center has scheduled ADU informational webinars/workshops for residents. The ADU Resource Center will also be hosting a plans gallery for compliance with AB 1332. ","This objective is completed on an ongoing basis throughout the 2023-2031 period. The San Mateo County ADU Resource Center webiste can be found here: https://smcadu.org/"],["H1.4 Support Increased Accessory Dwelling Unit Development","d)   Monitor ADU occupancy and rent levels to verify that affordability allocations. Tools to monitor will include, but are not limited to, collaboration with 21 Elements or ABAG to develop a uniform approach to tracking ADU affordability countywide, and surveying ADU applicants during the building permit review process to understand intended use, occupancy and rent charged.","12/31/2025","6th Cycle","Continuous","d) The City worked through the collaboration with 21 Elements and ABAG to establish an ADU Rent Survey. The rent survey has been approved by HCD to use to monitor rent levels to verify affordability allocations. The City has initiated using the survey in 2025 and requires property owners to complete the survey prior to issuance of the building permit.","This objective is completed on an ongoing basis throughout the 2023-2031 period. Accessory Dwelling Unit (ADU) Affordability Survey Tool:  https://abag.ca.gov/technical-assistance/accessory-dwelling-unit-adu-affordability-survey-tool"],["H1.4 Support Increased Accessory Dwelling Unit Development","e)   Continue to offer flat fees for ADU building permits, and review ADU permit fees every 2-3 years. If fees are found to be a barrier to ADU production, the City will make reductions as necessary to reduce cost barriers.  ","12/31/2025","6th Cycle","Continuous","The City currently offers flat fees for ADU building permits at a rate that is comparable with other jurisdictions in San Mateo County.","This objective is completed on an ongoing basis throughout the 2023-2031 period. See FY2025-26 Comprehensive Fee Schedule (page 2.5): https://www.cityofsanmateo.org/DocumentCenter/View/96744/Adopted-Comprehensive-Fee-Schedule-FY2025-26?bidId="],["H1.4 Support Increased Accessory Dwelling Unit Development","f)    Provide an annual report on ADU permitting data to verify that Housing Element production targets are being achieved. If ADU production targets are not achieved for two consecutive years, then, within six months, pursue additional actions, including fee reductions, increased homeowner resources and assistance, funding assistance, identifying additional sites and/or code amendments, to incentivize ADU production","12/31/2025","6th Cycle","Continuous"," In 2025, the City issued permits for 94 new ADUs and issued certificates of occupancy (finaled) for 66 new ADUs, which is above the Housing Element's production target of 55 permits issued per year. ","This objective is completed on an ongoing basis throughout the 2023-2031 period. See Summary Table from the 2025 APR."],["H1.5 Encourage Family Housing","a)   Present options to City Council for requiring a minimum percentage of three-bedroom units in City subsidized projects. \n","12/31/2025","6th Cycle","In Progress","a) On August 19, 2024, the City Council held a study session on setting minimum requirements for family-sized housing (3+ bedrooms), inlcuding the policy option of requiring one out of every five inclusionary housing units to contain 3 or more bedrooms. Staff was directed to return with specific policy language.\n","See Council August 19, 2024 Agenda: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=7983"],["H1.5 Encourage Family Housing","b)   Present options to City Council for requiring a minimum percentage of family-sized units in private development projects as part of the Inclusionary Policy update. ","12/31/2025","6th Cycle","In Progress","b)  On August 19, 2024, the City Council held a study session and the City Council considered requiring a percentage of all units in a residential project to be family-sized. Staff was directed to return with specific policy language.","See Council August 19, 2024 Agenda: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=7983"],["H1.5 Encourage Family Housing","c)   Should such policy recommendations not materialize into code amendments, explore alternative methods to promote family sized units through the community benefits program. ","12/31/2025","6th Cycle","Not Yet Started","c) Staff anticipates addressing family sized units in the Comprehensive Zoning Code Update process","Not yet started"],["H1.6 Streamline Housing Application Review","a)   Update the City Council resolutions that establish the pre-application and development review processes to eliminate the pre-application requirement for housing projects and eliminate the third-party design review requirement for housing projects that meet objective standards. \n\n\n","12/31/2024\n\n","6th Cycle","Completed","a) On July 15, 2024 the San Mateo City Council adopted Resolution No 65 (2024), repealing Resolution No. 69 (2020) that required a pre-application process prior to formal applications for housing projects greater than six units. Resolution No 65 (2024) adopts a new streamlined process for early public engagement. The Council also adopted Resolution No. 66 (2024) repealing Resolution No. 67 (1996) that required third-party design review of a project. Resolution No.66  (2024) allows the Zoning Administrator or the Planning Commission to request a third-party design review of a proposed housing project if the project is not in compliance with the Objective Design Standards.\n\n\nd) By 2025, the City will adopt code amendments that are consistent with SB 330.","Resolution 65 (2024): https://portal.laserfiche.com/Portal/DocView.aspx?id=2020108&repo=r-98a383e2&searchid=6252cb2e-266f-4d28-8dcd-b66485b5a15e\n\nResolution 66 (2024): https://portal.laserfiche.com/Portal/DocView.aspx?id=2020109&repo=r-98a383e2&searchid=63b74265-35f0-4f26-8c0f-ea54d911a6f8"],["H1.6 Streamline Housing Application Review","b)   Amend the Zoning Code to allow residential projects with up to 25 units to be approved administratively.","12/31/2023","6th Cycle","Completed","b) On December 3, 2023, the City adopted code amendments to allow Zoning Administrator approval for housing projects up to 25 units, subject to Objective Design Standards (Ordinance No. 2023-12).","Ordinance No. 2023-12: https://portal.laserfiche.com/Portal/DocView.aspx?id=2019940&repo=r-98a383e2&searchid=7ba549d4-b598-4735-b3e9-838a59bf33b7"],["H1.6 Streamline Housing Application Review","c)   Update permit application submittal requirements.","12/31/2023","6th Cycle","Continuous","c) Efforts to further streamline and update the permit application submittal requirements are ongoing. The City has updated the Planning Application Guide and Application as needed to address code and policy changes with the City's new early community engagement process and streamlined notification process.","This objective is completed on an ongoing basis throughout the 2023-2031 period. The Planning Application Guide and submittal requirements document are updated as needed and posted to the Planning Division webpage found here: https://www.cityofsanmateo.org/1135/Planning-Resource-Documents"],["H1.6 Streamline Housing Application Review","d)   Develop Zoning Code amendments to align City requirements with SB 330 and make a recommendation to the City Council.","12/31/2025","6th Cycle","Completed","On July 28, 2025, the City Council adopted  Ordinance 2025-05 that amended and added several sections of the Zoning Code to reduce the development review timeline for housing projects by streamlining the development review process, aligning City requirements with SB 330, and adding certainty in the development application process. The ordinance established an appeals process when a planning application is determined to be ‘incomplete’ subject to the review and determination of the Planning Commission.","Ordinance 2025-05: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/5"],["H1.7 Update Zoning Code Standards to Support Housing Production","a)   Evaluate the standards and requirements in all zone districts that allow for multi-family residential and amend the Zoning Code as needed to reduce or eliminate constraints to housing construction.  Specifically: 1) exclude covered parking and other elements as needed from Floor Area Ratio (FAR) calculation for housing projects with affordable units, 2) specify where Single-Room Occupancy (SRO) units are permitted consistent with government Code 65583(c)(1), and 3) specify that Manufactured Homes that are built on a permanent foundation are subject to the same zoning requirements and development standards as single-family homes.\n\n\n\n","12/31/2025","6th Cycle","Completed","1). The Land Use Element of the General Plan 2040 does not have a FAR limitation/maximum for housing development projects. Any Zoning Districts standards that are conflict are superseded with the General Plan policies; therefore, FAR maximums are not being applied to housing development projects. Comprehensive zoning code amendments are planned in 2026 to remove zoning code conflicts with General Plan policies.\n2) and 3) - On April 7, 2025, the City Council adopted an ordinance to update the zoning code to establish a definition for Single -Room Occupancy units and allow as a permitted use in R4 zoning Districts. The ordinance aslo added a provision that Manufactured Homes that are built on a permanent foundation are subject to the same zoning requirements and development standards as single-family homes.\n\n\n","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.7 Update Zoning Code Standards to Support Housing Production","b)   Amend the Zoning Code to reduce off-street parking requirements for residential units (SMMC Chapter 27.64) as follows:  Studio and 1 Bedroom units to 1 space, 2 Bedrooms and above to 1.5 spaces; and for projects within ½ mile of transit, consistent with AB2097, no off-street parking shall be required. As part of this amendment, staff will review all other parking related requirements and make recommendations to reduce or eliminate any other parking related requirements identified as a constraint. ","12/31/2025","6th Cycle","In Progress","b) In 2024, the City initiated work to explore parking requiring including amendments to the Zoning Code to reduce off-street parking requirements for residential uses. In 2025, the City has been working through an MTC TOC Technical Assistance Grant through the Metropolitan Transportation Commission to identify parking policy and standard reforms that align with state law and regional efforts. It is anticipated that this work will be concluded in 2026 and the work efforts will be folded into the Comprehensive Zoning Code Update.","None"],["H1.7 Update Zoning Code Standards to Support Housing Production","c)   Amend the Zoning Code to make residential uses, which currently require a special use permit, a permitted use in the C1, C2, C3, E1 and E2 districts for non-R Overlay areas.","12/31/2024","6th Cycle","Completed","c) In 2024, the City initiated the comprehensive code amendments to permit residential uses for all Commercial and Executive Office zones in non-R overlay areas. This removes the requirement for a special use permit. On April 7, 2025, the City Council adopted an ordinance to update the zoning code to make residential uses a permitted use in the C1, C2, C3, E1 and E2 districts for non-R Overlay areas.","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.7 Update Zoning Code Standards to Support Housing Production","d)   Rezone sites with quasi-public uses such as schools, churches, and other facilities of an educational, religious, charitable, or philanthropic nature,  to “Quasi-Public,” following completion of the General Plan Update and allow for a variety of housing types such as duplexes to multi-family as permitted uses in this zone district.","12/31/2025","6th Cycle","Continuous","d) In 2025, the City initiated a comprehensive zoning code update including a new \"Quasi-Public\" zoning district that will be consistent with the adoption of the land uses in General Plan 2040 (adopted March 18, 2024).","This objective will be incorporated into the comprehensive zoning code update anticipated to be adopted in 2026."],["H1.7 Update Zoning Code Standards to Support Housing Production","e)   Evaluate the feasibility of an affordable housing quasi-public overlay or code amendment to support the production of affordable housing on quasi-public sites, such as religious or educational institutions.","12/31/2026","6th Cycle","Not Yet Started","e) The City will conduct a feasibility study for an affordable housing quasi-public overlay in 2026 (as part of the comprehensive zoning code update).","Not yet started"],["H1.8 Adopt Objective Design Standards","Adopt Objective Design Standards for multi-family residential projects and mixed-use projects with a residential component.","1/31/2023","6th Cycle","Completed","On December 3, 2023, the City adopted ODS and associated code amendments to streamline eligible small-scale housing projects. Code amendments include Zoning Administrator approval for housing projects up to 25 units, subject to ODS (Ordinance No. 2023-12).","Ordinance No. 2023-12: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2023/12"],["H1.9 Establish Minimum Densities for Mixed-Use Projects","a)   Amend the Zoning Code to require that properties designated for mixed-uses, in the Sites Inventory List, allow 100 percent residential use and require that residential use occupy 50 percent or more of the total floor area of a mixed-use project consistent with Government Code Section 65583(h), and establish a minimum residential density for mixed-use projects elsewhere in the City that include a residential component.\n","12/31/2024","6th Cycle","Completed","a) In 2024, the City initiated the comprehensive code amendments to permit 100 percent residential uses on properties zoned for mixed uses. These Zoning Code amendments will be introduced to the Council for adoption in 2025 aggregated with other code amendments. The reference to Government Code Section 65583(h) is incorrectly stated. The correct reference should be Government Code Section 65583.2, subdivisions (h) and (i). Compliance is only required when the sites inventory does not identify site to accommodate the need for groups of all household income levels. However, the San Mateo Housing Element sites inventory did accomodate sites for all of its household income levels without the need for rezonings; therefore, nothing further is necessary to comply with the Government Code. In 2023, the City initiated policy work with a consultant to evaluate minimum residential density requirements for large commercial mixed-use projects. On August 19, 2024, the City Council held a study session on requiring a minimum residential density in mixed-use projects with a residential component. On July 28th, 2025, the City Council adopted an ordinance that establishes minimum residential densities for mixed-use projects that include a residential component with five or more units.","Ordinance 2025-05: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/5"],["H1.9 Establish Minimum Densities for Mixed-Use Projects","b)   Study and present to City Council options for requiring a residential component in all mixed-use projects in certain zones or areas. ","12/31/2024","6th Cycle","Completed","b) At a City Council Study Session on August 19, 2024, city staff provided an overview of requiring minimum residential densities and requiring a residential component in all mixed-use projects. The Council reached consensus to further explore setting minimum residential density requirements for mixed-use\ndevelopments, but they did not reach consensus on requiring all mixed-use projects to require residential units. ","August 19, 2024 City Council Special Meeting Agenda (Item #2): https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=7978\n\nAugust 19, 2024 City Council Meeting Minutes (Consent Calendar Item #3, on October 21, 2024): https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=8018"],["H1.10 Establish By-Right Housing Designation for Prior Housing Sites","Amend the Zoning Code to establish a By-Right designation for housing sites reused from prior Housing Elements for housing projects that propose a minimum of 20% affordable units. Zoning for these sites must be at least 30 units/acre to meet default density requirements for lower-income households per Gov. Code Section 65583.2(c).","12/31/2024","6th Cycle","Completed","On July 15, 2024, the City Council adopted Ordinance No. 2024-4 adding Chapter 27.94 Housing Opportunities Overlay District (H) to the Zoning Code. The (H) Overlay establishes a Housing By-Right designation for housing sites reused from prior Housing Elements for housing projects that propose a minimum of 20% affordable units. Zoning for these sites must be at least 30 units/acre to meet default density requirements for lower-income households","Ordinance 2024-4: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2024/4"],["H1.11 Implement the SB 9 Ordinance","Continue to implement Zoning Code Chapter 27.21 (Two-Unit Development Residential Overlay District), adopted in September 2022, which facilitates the provisions of SB 9 in single-family districts (R1).","12/31/2023","6th Cycle","Continuous","On October 3, 2022, the City adopted a local Two-Unit Development Overlay District Ordinance (SMMC 27.21) to implement the provisions of SB 9.","This objective is completed on an ongoing basis throughout the 2023-2031 period"],["H1.12 Encourage Development of Missing Middle Housing","a)   Evaluate residential zoning districts that have sites with potential for Missing Middle Housing (R2, R3 and R4 zones) and identify development standards that create barriers for small-scale development, including minimum lot size, setbacks, floor area ratio, parking, and open space requirements, and amend the Zoning Code to remove any constraints, and maximize developable area, and increase capacity. \n","12/31/2026","6th Cycle","Not Yet Started","a) Effective January 3, 2024, streamlined review is available for small-scale housing projects up to 25 units and subject to ODS (Policy H1.8), through administrative review and approval without the need for public hearings. By 2026, staff will evaluate the identified residential zoning districts that have potential for Missing Middle Housing through a comprehensive code amendment effort. SB 79 will be effective July 1, 2026 which supersedes local zoning and may have implications for the development of Missing Middle type housing.","Not yet started"],["H1.12 Encourage Development of Missing Middle Housing","b)   Research and evaluate policies and code amendments to allow for Missing Middle housing under SB 10 and schedule for City Council consideration and adoption.","12/31/2026","6th Cycle","Not Yet Started","The City began researching SB 10 and will present policy options relating to Missing Middle housing for City Council feedback and direction by 2026.","Not yet started"],["H1.13 Update Special Needs Group Housing Requirements","a)   Review and amend the Zoning Code to allow group homes and residential care facilities for persons with special needs, including those who are ELI,  in all residential zones, only subject to those objective standards that apply to other residential uses of the same type in the same zone in conformance with state law. ","12/31/2025","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to update the zoning code with new definitions for group homes and residential care facilities and adopted provisions to allow these uses in all residential zones as a permitted use and will only be subject to standards that apply to other residential uses of the same type in the same zone.","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.13 Update Special Needs Group Housing Requirements","b)   Review and amend the Zoning Code definition for family, and other related regulations, to ensure consistency with State and Federal fair housing laws related to persons with disabilities. This effort may also include consideration of new definitions such as single-unit and multi-unit dwellings to accommodate various housing situations.","12/31/2025","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to update the zoning code with new/revised definitions for family and different types of dwelling units. ","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.13 Update Special Needs Group Housing Requirements","c)   Study best practices and develop a universal design ordinance that may better address housing needs for persons with disabilities.","12/31/2027","6th Cycle","Not Yet Started","c) Staff will research and develop a universal design ordinance for housing for persons with disabilities in 2027.","Not yet started"],["H1.14 Update Supportive Housing Requirements","Amend the Zoning Code to be consistent with AB 2162 to allow by-right 100% affordable housing that has 25% or 12 units of permanent supportive housing, where multi-family or mixed-use housing is permitted. ","12/31/2024","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to update the zoning code that added a provision to R3 zoning districts stating that supportive housing in compliance with Government Code Sections 65650 - 65656, shall be considered a use by-right use. \"Use by right\" shall have the same meaning as defined in Government Code Section 65583.2(i). The R3 permitted uses are enumerated in other multi-family residential and mixed-use districts.","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.15 Update Mobile Home Parks Requirements","Amend the Zoning Code to allow mobile home parks as a special use in all residential zones to be consistent with Government Code Section 65852.7","12/31/2025","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to add a defintion for mobilehome park (Section 27.04.313.1) and adding mobilehome park as a special use permit to the R2 District (Section 27.20.020). The R3 and R4 Districts enumerates all R2 District permitted uses.","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.16 Update Farmworker Housing Requirements","Amend the Zoning Code to define and allow farmworker housing within the Agricultural District consistent with Government Code Section 17021.6. The City will comply with Health and Safety Code section 17021.5.","12/31/2025","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to add a definiton section (27.060.020) in Chapter 27.60 Special Districts, Article I Agricultural Districts and adding the term 'farmworker housing' and include the defintions of farmworker housing from Health and Safety Code Sections 17021.5 and 17021.6.  Farmworker housing up to 36 beds in group quarters (or 12 units or less) was added as a permitted use under Agricultural Districts (Section 27.60.030). Temporary farmworker housing consisting of more than 36 beds in a group quarters or more than 12 units or spaces designed for use by a single family or household was added as a special use under Section 27.60.040.  ","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H1.17 Permitting and Development Fee Review","a)   Study cumulative permit fee costs for new housing development of various sizes and use information to identify opportunities to reduce per unit permitting costs; with fee reductions for small multi-family projects being prioritized. Present findings to the City Council with recommendations for adoption.\n","12/31/2025","6th Cycle","In Progress","a) Staff has been researching cumulative permit fee costs for new housing developments of various sizes and significantly reduced permitting costs for projects. This will be evaluated as part of a citywide fee study update that is scheduled to begin in Q2 of 2026.\n","Not yet started"],["H1.17 Permitting and Development Fee Review","b)   Conduct a comprehensive review and update of the fee schedule every 5-6 years, with a focus on evaluating and adjusting fees with potential barriers to housing production. Next review will be conducted in 2027 (last fee study completed in 2021).","12/31/2027","6th Cycle","Not Yet Started","b) The City anticipates initiating its next comprehensive fee study in 2026, ahead of the 2027 target.","Not yet started"],["H1.18 Increase Senior Housing Production","Evaluate code amendments and/or policies to encourage and support the development of senior housing, especially senior housing that serves the ELI and lower income senior housesholds, including through shared‐ housing arrangements, community care facilities, supportive housing, and assisted living for seniors, and make a recommendation to the City Council.","12/31/2028","6th Cycle","Not Yet Started","This program is anticipated to begin implementation in 2027/2028.","Not yet started"],["H1.19 Ensure Adequate Water Supply for the Development of New Housing","a)   Upon adoption of the Housing Element, provide a copy of the Element to California Water Company, Estero Municipal Improvement District, and San Mateo Public Works Dept, for greater awareness of affordable housing priorities and collaboration, in compliance with AB 1087.\n\n\n","12/31/2023","6th Cycle","Completed","a) After the updated Housing Element was certified by HCD, a copy of the Housing Element was emailed to the California Water Company (Cal Water), Estero Municipal Improvement District (EMID), and the City's Public Works Department.\n\n\n","An email was sent to respective agencies."],["H1.19 Ensure Adequate Water Supply for the Development of New Housing","b)   Support efforts by Cal Water and EMID to expand their water supplies with new water sources and develop water efficiency and conservation methods to offset demand from new development projects.","12/31/2023","6th Cycle","Continuous","b) The Public Services and Facilities Element in the City's General Plan 2040 includes 11 policies and actions that support coordination with the City's water providers to increase  supply capacity, improve water efficiency in new development and increase local conservation efforts. Implementation of these policies and actions is ongoing.","This objective is completed on an ongoing basis throughout the 2023-2031 period."],["H1.19 Ensure Adequate Water Supply for the Development of New Housing","c)   Pursuant to AB 1087, work with Cal Water and EMID to establish a procedure to prioritize water allocation for developments that include units set aside as affordable housing for lower income households, including affordable housing within larger, mixed-use developments and larger residential subdivisions ","12/31/2023","6th Cycle","Completed","c) The City continues to engage with Cal Water and EMID to ensure that affordable housing projects are prioritized for water service allocations, with ongoing efforts to formalize the process. ","The City engages with Cal Water and EMIC on an ongoing basis."],["H1.19 Ensure Adequate Water Supply for the Development of New Housing","d)   Establish a written procedure for the City to grant priority sewer service to developments with units that are affordable to lower-income households.","12/31/2023","6th Cycle","Completed","d) There are currently no limitations on available sewer service capacity and all housing projects have been able to obtain sewer service as requested. ","N/A"],["H1.20 Adopt San Mateo General Plan 2040","a)   Complete the General Plan 2040 Update (GPU) process and present to the City Council for adoption. The City is committed to adopting a General Plan that will create capacity for at least 10,000 new housing units and will increase the base densities in the 10 Study Areas by at least 25 du/ac and height limits by at least two stories. \n\n\n\n","12/31/2024","6th Cycle","Completed","a) On March 18, 2024, the City Council adopted General Plan 2040. The Land Use Element established new land use designations and map that increases housing capacity by approximately 19,700 new housing units, increases base densities to up to 130 du/ac, and increases heights up to eight stories.\n\n\n","https://strivesanmateo.org/general-plan-2040/"],["H1.20 Adopt San Mateo General Plan 2040","b)   Commence with rezoning Citywide, in phases, to implement the land use map following GPU adoption.","12/31/2026","6th Cycle","In Progress","In March of 2025, staff issued a Request for Proposals (RFP) for a qualified consultant to support the Comprehensive Zoning\nCode Update Project.  On June 16, 2025, the City Council voted to appropriate funding to complete the Zoning Code Update Project and to execute a professional services agreement with\na consultant to support this effort. Staff held the project kick-off meeting beginning of July, 2025. Staff has scheduled community workshops and a Council study session in Q1 of 2026. The City's goal is to have a draft of Zoning Code update ready in Fall 2026 and adoption by the end of 2027.","This work effort is ongoing. Updates to the comprehensive zoning code update can be found on this website: https://strivesanmateo.org/zoning-code-update"],["H1.20 Adopt San Mateo General Plan 2040","c)   The GPU public outreach and engagement process will include  information on Measure Y and how it creates a constraint on housing production.","12/31/2024","6th Cycle","Completed","c) In addition to the extensive community outreach and engagement effort in summer/fall 2023, the City conducted a statistically valid survey of likely voters to understand voter opinion on different building heights (8, 10 and 12) that should be included in the General Plan to help build community awareness and consensus around the issue, and the results were presented to the public and City Council on October 30, 2023. Staff also created a public handout discussing Measure Y and the proposed density and height limits.","This efforst was included in the General Plan 2040 project. General Plan 2040 information can be found on this website: https://strivesanmateo.org/general-plan-2040/"],["H1.20 Adopt San Mateo General Plan 2040","d)   The City will place an updated Measure Y ballot initiative to allow for the increased heights and densities in the adopted General Plan on the November 2024 election.","11/31/2024","6th Cycle","Completed","d) Measure T, which repealed Measure Y and allows for the increased heights and densities adopted in General Plan 2040 was placed on the November 2024 ballot and was approved by the voters.","Measure T information can be found on this webpage: https://www.cityofsanmateo.org/4658/2024-Election"],["H1.20 Adopt San Mateo General Plan 2040","e)   If the Measure Y ballot initiative does not pass in November 2024, present alternative plans within six months to the City Council, including a plan for rezoning, to address the housing production constraint of Measure Y with an emphasis on higher densities in high/highest resource areas and to add at least 1,700 units of new capacity around the City, thereby increasing the City’s RHNA buffer by at least 25%.","5/31/2025","6th Cycle","Completed","e) This program is not needed since the voters approved Measure T.","Program not required. See notes."],["H2.1 Fund Housing Rehabilitation Efforts","a)   Complete annual goals of 10 minor home repairs and 14 accessibility modifications through grants for lower-income residents, targeting ELI households where appropriate.\n\n","12/31/2025","6th Cycle","Completed","a) In 2025: 2 minor home repair projects were completed.\n\n","This objective is implemented annually. Minor home repair programs are funded by the Community Development Block Grant (CDBG). The City did not receive its entitlement amount for the 25-26 program year because it has not executed a Grant Ageement with the US Department of Housing and Urban Development (HUD). This affects July-December 2025 and is  the primary reason for the failure to meet the target of 10 projects. "],["H2.1 Fund Housing Rehabilitation Efforts","b)   Provide home rehabilitation loans for lower-income residents up to a total of approximately $500,000 available.","12/31/2025","6th Cycle","In Progress","b) There were no rehabiliation loans issued in 2025.","No loans issued in 2025."],["H2.1 Fund Housing Rehabilitation Efforts","c)   Affirmatively market the availability of these funds to both homeowners and renters to increase awareness. Marketing efforts include translating flyers into Spanish and distributing flyers to various locations throughout the City, including libraries, senior and community centers and non-profit agencies. Outreach will be conducted biannually.","12/31/2025","6th Cycle","Completed","c) The City continutes to collaborate with its partner agency, Rebuilding Together, to affirmatively market both programs on minor home repair and home rehabilitation loans. ","The City renewed its contract with Rebuilding Together for administration of the home rehab loan program in June 2025. Staff made several changes to the contract to improve the efficiency of the program. Staff also worked with Rebuilding Togethrer to revise its program flyer and distribute it in key locations throughout the City. "],["H2.2 Support Retention of Existing Lower Income Units","a)   Bridgepointe Condominiums affordability requirements for 59 affordable units expire in 2027, out of which 24 are very low-income units (35 are at 120% AMI). Belmont Building affordability requirements for 6 units expire in 2032. The rental property is owned by a for-profit entity, potential for loss of units is high. \n","12/31/2026","6th Cycle","In Progress","a) The Bridgepointe Condominiums were identified as a priority to address. Their affordability requirements for 24 low-income units will expire in 2027. Options such as using Housing funding sources to provide a loan for needed rehab and to place a new affordability restriction on the property are currently being explored. \n","Nothing to report. Work on this began in 2026 and will be reported on in the following APR."],["H2.2 Support Retention of Existing Lower Income Units","b)   Proactively coordinate with owners to preserve the 24 very low-income units as affordable, including identifying potential funding sources, advertise conversion units to non-profits, conduct tenant outreach and education, add a displacement preference for new affordable housing for people displaced, including those displaced as a result of conversion. Outreach and negotiate with owners for affordability extensions. Provide noticing to tenants and affected public entities in accordance with Gov. Code, § 65863.10, 65863.11, and 65863.13","12/31/2031","6th Cycle","Not Yet Started","b) Belmont Building affordability requirements for 6 low-income units expire in 2032. Staff will proactively reach out to owners to extend affordability and mitigate displacement.","Not yet started."],["H2.3 Increase Energy and Water Efficiency in Existing Units","a)   Complete seven weatherization upgrades through grants for lower-income residents annually, targeting ELI households when appropriate.\n","12/31/2025","6th Cycle","Not Yet Started","a) In 2023: Zero weatherization upgrades were completed. Staff is searching for a new non-profit partner for weatherization upgrades as the previous partner has dropped the service.\n","This objective is implemented annually. Some weatherization upgrades may be included in the scope of minor home repairs provided by the City's Communty Development Block Grant (CDBG)-funded programs, but this is not the primary focus of those organizations."],["H2.3 Increase Energy and Water Efficiency in Existing Units","b)   Implement energy-efficiency and electrification strategies identified in the City's Climate Action Plan through updates to the City’s Reach Codes as part of the building permit review process. Outreach will be conducted biannually.","12/31/2025","6th Cycle","In Progress","b) The City's updated Reach Codes went into effect, requiring any remodel projects to include energy and water efficiency measures. In 2024, Due to a federal court decision, the City suspended enforcement of its Reach Codes that prohibit the installation of new gas infrastructure.  The Ninth Circuit Court of Appeals in California Restaurant Association v. City of Berkeley determined that a local ordinance that generally prohibited the installation of natural gas infrastructure was preempted by federal law, namely the Energy Policy and Conservation Act (EPCA). At a November 3, 2025 City Council meeting, the Council reviewed four reach code options that does not require whole home electrification and directed staff to develop an ordinance that had all four reach code options. The Council is scheduled to consider the draft ordinance in Q1 2026.","Reach Code information including updates to the Reach Code can be found here: https://www.cityofsanmateo.org/3363/Reach-Codes"],["H2.4 Implement Capital Improvements in Lower-Resourced Neighborhoods","a)   Use available CDBG funds to make CIP improvements in identified Equity Priority Neighborhoods (including North Central and North Shoreview neighborhoods). Potential improvements may include: street work, crosswalk implementation, ADA ramp installation, striping, sidewalk improvements, traffic signal replacement, and other pedestrian/bicycle enhancements. Allocate available CDBG funds on an annual basis.","12/31/2025","6th Cycle","Completed","a) In 2025, traffic signal and pedestrian safety improvments were completed using CBDG funds. The project was done in the intersection of 3rd and Norfolk, located in the North Shoreview neighborhood.\n\n\n","This objective is implemented annually. 3rd Ave. and Norfolk St. Intersection Safety Improvements webpage can be found here: https://www.cityofsanmateo.org/4744/3rd-Ave-and-Norfolk-St-Intersection-Safe"],["H2.4 Implement Capital Improvements in Lower-Resourced Neighborhoods","b)   Implement Bike Master Plan and Pedestrian Master Plan through capital improvements in Equity Priority Neighborhoods.","12/31/2025","6th Cycle","Completed","b) The City continues to implement the Bike Master Plan, Complete Streets Plan (which consolidated the Pedestrian Master Plan), and the North Central Complete Streets Plan,  is a community-led plan focused on the North Central neighborhood, through capital improvements through the Public Works Department.","The Bike Master Plan can be found on this webpage: https://www.cityofsanmateo.org/3944/Bicycle-Master-Plan-2020\n\nThe Complete Streets Plan can be found on this webpage: https://www.cityofsanmateo.org/CompleteStreets\n\nThe North Central Complete Streets Plan can be found on this webpage: https://www.cityofsanmateo.org/4741/Complete-Streets-North-Central-Plan"],["H2.4 Implement Capital Improvements in Lower-Resourced Neighborhoods","c)   Conduct proactive public outreach to identify and prioritize capital improvements that best align with a neighborhood’s most critical needs.","12/31/2025","6th Cycle","Completed","c) The City conducts annual public outreach through the Public Works Department and through the Housing Division Community Needs Workshop to identify critical neighborhood needs. The Community Needs Workshop, hosted by the City's Community Relations Commission, was held on November 19, 2025. ","See November 19, 2025 Community Relations Commission, Item #2, Community Needs Workshop for 2026-27 Community Development Block Grant (CDBG) Annual Action Plan:https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=10343"],["H2.4 Implement Capital Improvements in Lower-Resourced Neighborhoods","d)   Apply for funding biannually, consistent with CIP efforts and CDBG to pursue at least eight improvement projects over eight years in Equity Priority Areas.","12/31/2025","6th Cycle","Completed","d) The City continues to use CDBG funding and other sources to complete CIP improvement projects in Equity Priority Areas.","CDBG information can be found on this website: https://www.cityofsanmateo.org/1588/Community-Development-Block-Grant-CDBG"],["H2.5 Promote Housing Resilience","Provide Flood Improvements for the North Shoreview neighborhood through the levee project with Public Works.","12/31/2023","6th Cycle","Completed","The North Shoreview levee project was completed by the Department of Public Works on June 28, 2023. In October 2024, FEMA published new flood maps that removed the North Shoreview area out of Special Flood Hazard Areas (100 year flood zones). ","North Shoreview Flood Improvement Project information can be found on this webpage: https://www.cityofsanmateo.org/1796/North-Shoreview-Flood-Improvement-Projec"],["H2.6 Require Replacement Units","a)   Conduct a study to determine whether the City should update the zoning ordinance and other policies to permanently require replacement of units (beyond Housing Crisis Act sunset date of 2034). This action must be completed within three years from the start of the planning period.\n","12/31/2026","6th Cycle","Completed","a) AB 130 repealed Government Code Section 66301 which had a sunset date of January 1, 2034. AB 130 made the replacement unit provisions of the Housing Crisis Act permanent.\n","See SEC. 26. of AB 130. https://leginfo.legislature.ca.gov/faces/billCompareClient.xhtml?bill_id=202520260AB130&showamends=false"],["H2.6 Require Replacement Units","b)   The City will require replacement housing units subject to the requirements of Government Code Section 65915(c)(3), when a development project or demolition occurs on sites with existing residential units that are restricted or have been occupied by a lower income household in the past five years.","5/20/2024","6th Cycle","In Progress","b) The City currently requires all applicable development projects to provide replacement housing units in accordance with Government Code Section 65915(c)(3).","The City implements this state law as required under state law."],["H3.1 Prevent Homelessness","a)   Allocate PLHA, CDBG, and other local funds to support homeless prevention these may include the following programs: LifeMoves Rapid Rehousing Program, Safe Harbor Shelter, Vendome Hotel supportive units, LifeMoves First Step for Housing program, HIP Housing home sharing and Montara assisted units for the formerly homeless.\n","12/31/2025","6th Cycle","Completed","a) In 2025: 336 individuals were served by City programs to prevent homelessness.\n","This objective is implemented annually. Organizations funded through PLHA are on the City's website: https://www.cityofsanmateo.org/3765/Community-Funding-Program. "],["H3.1 Prevent Homelessness","b)   Support the County in its efforts to convert the Stone Villa Hotel into a 44-room temporary shelter space as part of the Project Homekey programs.","12/31/2025","6th Cycle","Completed","b) The City supported the County's effort to convert the Stone Villa Hotel into a new temporary shelter space via the Project Homekey Program. The shelter opened in 2022 offering 44 units and is operated by Samaritan House.","This objective has been completed. "],["H3.2 Investigate Fair Housing Cases","As CDBG funding permits, achieve the Annual Fair Housing Activity Goals:  \n• Investigate all complaint cases; \n• Provide consultation to at least 30 individuals; \n• Increase public Education/Outreach to tenants, landlords, and housing professionals by 50% over eight years (from 26 to at least 40 persons); and  \n• Provide legal assistance to at least 185 renters. \nThese numbers are subject to change based on funding availability.","12/31/2025","6th Cycle","Completed","In 2025: 8 fair housing case clients were served. 18 individuals received public education/outreach and 62 individuals received consultations.","This objective is implemented annually. More information on the City's investment in Fair Housing ca be found on the City's website under Community Funding: https://www.cityofsanmateo.org/3765/Community-Funding-Program "],["H3.3 Evaluate Housing Revenue Sources","a)   Conduct a feasibility study on increasing the fee to generate additional housing funds gathered from commercial development, analyze the study, conduct community outreach and make a recommendation to the City Council.  Proceed as directed by Council.\n","12/31/2026","6th Cycle","In Progress","a) The City has joined  a County-wide effort to conduct a nexus study to set new commercial linkage fees. The partner jurisdictions drafted a Request for Proposals (RFP) in fall 2024 to identify a firm to conduct the nexus study. Work on the Grand Nexus Study began in 2026, with a report completed for City Council consideration in late 2026 or early 2027.\n","a.) The Grand Nexus Study did not commence until early 2026. However, a firm was selected to conduct the study (Strategic Economics) in 2025 and all partner jurisdictions signed an MOU so that the work could begin."],["H3.3 Evaluate Housing Revenue Sources","b)   Examine other possible revenue sources and bring the proposals before City Council for consideration. Actively track available funding opportunities and coordinate with City partners, including non-profit housing developers on how best to leverage these resources. ","12/31/2025","6th Cycle","Completed","b) The City tracks State and local sources and funding and the timing of Notices of Funding Availability (NOFAs). For affordable projects in the City, staff works closely with developers to identify State and local sources of funding to include in their project's financing plan.","This objective is implemented annually."],["H3.4 Expand Tenant Protections","a)   Extend AB1482 provisions to require tenant relocation payments for No Fault evictions for those with tenure less than one year.","12/31/2024","6th Cycle","Completed","a) In fall of 2024, staff began conducting outreach and researching best practices for code amendments to extend tenant relocation protections to tenants with tenure less than one year. This research was combined with researching tenant protection policies for substantial remodel evictions as described in b) and strengthened enforcement penalties for substanard units in c), in addition to research on a rental registry to track rental rates and evictions citywide, as described in Policy H.36. Staff presented those findings to the City Council in a study session on April 21, 2025 and returned on November 17, 2025 with two ordinances to implement a) and c). The ordinances became effective Jan 1, 2026. City Council did not direct staff to establish a rental registry but instead to collect voluntary information from property owners via the City's business tax application platform. Finally, City Council directed staff to establish an Emergency Rental Assistance Program funded with local funds and administered by a local nonprofit.\n\n\n","a) Tenant Protections Community Workshop, November 20, 2024: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9190                       b and c) City Council Study Session April 21, 2025: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9475, City Council Regular Meeting November 17, 2025:  https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9593                       a) and c) Chapter 10.010 of the San Mateo Municipal Code: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/code/10.100,                       Chapter 7.50 of the San Mateo Municipal Code: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/code/7.50"],["H3.4 Expand Tenant Protections","b)   Make recommendations to the City Council for establishing tenant protection policies that include the requirement of documentation from landlords who use the substantial remodel exemption to evict tenants and a Right to Return policy for tenants displaced from homes due to demolition or substantial remodels.","12/31/2026","6th Cycle","Completed","b) This action was incorporated into the tenant protections/anti-displacement policies in H3.4, as discussed above. City Council directed staff to require property owners to notify the former tenant when the substantially-remodeled unit becomes available. This is part of the ordinance adopted on November 17, 2025. Additional documentation requirements were not incorporated into the ordinance new state law addressed this.","November 17, 2025 City Council Regular Meeting: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9593               \n\nChapter 10.010 of the San Mateo Municipal Code: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/code/10.100"],["H3.4 Expand Tenant Protections","c)   Amend the Code to strengthen enforcement penalty structure to aid in protecting tenants from unsafe or substandard units.","12/31/2024","6th Cycle","Completed","c) This research was combined with a) and b) above, and was presented to City council, as discussed above. An ordinance was adopted November 17, 2025.","November 17, 2025 City Council Regular Meeting:  https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9593               Chapter 7.50 of the San Mateo Municipal Code: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/code/7.50"],["H3.4 Expand Tenant Protections","d)   Conduct outreach to the community on a biannual basis.","12/31/2025","6th Cycle","Continuous","d) Staff has conudcted extensive community outreach as part of the research phase for tenant protections/anti-displacement. A community workshop on tenant protections/anti-displacement, hosted by the City's Community Relations Commission, was held on November 20, 2024, in addition to a series of focus group meetings with organizations in San Mateo.  Stakeholder outreach continued into 2025, leading up to the April 21, 2025 study session on anti-displacement/tenant protections.","Tenant Protections Community Workshop, November 20, 2024: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9190                    April 21, 2025 City Council Study Session: https://sanmateo.primegov.com/Portal/Meeting?meetingTemplateId=9475"],["H3.5 Study the Creation of Below Market Rate Set Asides","Conduct a best practices research on prioritization of households with special needs, extremely low-income households and large families. Analyze the data, conduct community outreach and make recommendations to the City Council. Proceed as directed by Council.","12/31/2026","6th Cycle","In Progress","The City hired a consultant, Economic Planning Systems, in 2023 to study feasibility of establishing priority allocation for certain types of BMR units. The City may phase this effort to look at priority allocation for households with special needs or extremely low income households.","The City will address this in the Inclusionary/BMR Program update in 2026."],["H3.6 Monitor Rental Rates and Displacement.","a)   Research options and best practices for a rental registry list, including determining necessary financial and human resources needed to establish such a program.  Make recommendations to City Council.\n","12/31/2024","6th Cycle","Completed","a) Staff began research on rental registries in Fall 2024 in parallel with other tenant protections/anti-displacement measures in Policy H.3.4. Staff presented its findings and recommendations to the City Council in a study session on April 21, 2025. City Council directed staff not to establish a formal rental registry but to instead request voluntary information from property owners via the City's business license platform.\n","The work to incorporate questions into the City's business license platform will be completed in spring 2026"],["H3.6 Monitor Rental Rates and Displacement.","b)   Collaborate with regional partners, such as 21 Elements or ABAG, to develop ways to monitor rental rates, evictions and displacement citywide and countywide to track trends and use the information to guide policy priorities.","12/31/2024","6th Cycle","Continuous","b) Staff continues to collaborate with county-wide efforts to enact Housing Element policies, which includes monitoring rental rates, evictions, and displacement. This includes an eviction study being conducted by Stanford University and ABAG, anticipated in spring of 2025.","This objective is targeted ongoing throughout the entire planning period. The referenced eviction study was completed and staff used these findings to inform the April 21, 2025 study session on tenant protections/anti-displacement. The key finding that most evictions are due to nonpayment of rent led to the City Council directing staff to create the Emergency Rental Assistance Program."],["H3.7 Evaluate Opportunities for Expanding Homeless Shelters","a)   Study best practices for expansion of homeless shelter sites. Analyze the data, conduct community outreach and recommendations to City Council. Proceed as directed by Council.\n\n\n\n","12/31/2023","6th Cycle","Continuous","a) San Mateo continues to be involved with the County Continuum of Care to provide programs to serve the San Mateo homeless population.\n\n\n","This objective is targeted ongoing throughout the entire planning period. City staff sits on the CoC Steering Committee."],["H3.7 Evaluate Opportunities for Expanding Homeless Shelters","b)   Regularly evaluate zoning to ensure enough sites are available to accommodate the capacity for emergency shelters, based on the countywide Point in Time Homeless Count.","12/31/2023","6th Cycle","Continuous","b) Emergency shelters are allowed in all C2 and C3 zoning districts. There is approximately 240 acres of land in the City of San Mateo with C2 or C3 base zones which is sufficient for potential emergency shelters to serve the estimated 95 unsheltered individuals in the City of San Mateo (2024 One Day Homeless count).","This objective is targeted ongoing throughout the entire planning period."],["H3.7 Evaluate Opportunities for Expanding Homeless Shelters","c)   Review and amend the zoning code to allow emergency shelters in C2, C3, and other zones as needed to ensure there is sufficient capacity on available sites to accommodate the need for emergency shelter as identified in the most recent point-in-time count conducted before the start of the planning period, and to amend the definition of emergency shelters, in compliance with Government Code 65583.","12/31/2023","6th Cycle","Completed","c) On April 7, 2025, the City Council adopted an ordinance to modify the defintion for homeless shelters (Section 27.04.177). Emergency shelters are already a permitted use in the C2 District. The C3 District enumerates all permitted uses in the C2 District. ","This objective is targeted ongoing throughout the entire planning period. Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H3.7 Evaluate Opportunities for Expanding Homeless Shelters","d)   Review and amend the zoning code as needed to comply with Government Code 65583 including to remove the 300 feet buffer from a single-family dwelling, clarify that emergency shelters are not required to be more than 300 feet apart and adopt objective development standards, such as parking for shelters in compliance with Government Code Section 65583(a)(4)(A)(ii).","12/31/2025","6th Cycle","Completed","c) On April 7, 2025, the City Council adopted an ordinance to modify the defintion for homeless shelters (Section 27.04.177) and removed the separation requirement.","This objective is targeted ongoing throughout the entire planning period. Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H3.7 Evaluate Opportunities for Expanding Homeless Shelters","e)   Review and amend the zoning code as needed to comply with requirements of AB 101 (2019) to allow Low Barrier Navigation Centers (LBNC) as a permitted use by right in areas zoned for mixed use and nonresidential zones permitting (by right or through a Special Use Permit) multifamily uses if it meets specific requirements in Government Code sections 65660 – 65668. ","12/31/2025","6th Cycle","Completed","On April 7, 2025, the City Council adopted an ordinance to add the term 'low-barrier navigation center' and defintion in Section 27.04.177. Section 27.30.010 (C1 District) was modified to permit low-barrier navigation centers by right consistent with Government Code Sections 65660 - 65668. The C2 District enumerates permitted uses in the C1 District.","Ordinance No. 2025-03.: https://law.cityofsanmateo.org/us/ca/cities/san-mateo/ordinances/2025/3"],["H4.1 Update the Housing Webpage","a)   Maintain and improve webpage with comprehensive housing related information and materials, and coordinate with providers to market programs electronically.\n\n","12/31/2031","6th Cycle","Continuous","The City continues to update its webpages with guides, plans, and other worksheets on new housing law, housing programs, and other resources.","This objective is targeted ongoing throughout the entire planning period. \n\nThe Housing Division website is located here: https://www.cityofsanmateo.org/501/Housing-and-Neighborhood-Services\n"],["H4.1 Update the Housing Webpage","b)   Provide information in multiple languages using common terms. ","12/31/2031","6th Cycle","Continuous","The City continues to update its website to include relevant housing information. This includes translation of key materials.","This objective is targeted ongoing throughout the entire planning period. \n\nThe Housing Division website is located here: https://www.cityofsanmateo.org/501/Housing-and-Neighborhood-Services\n"],["H4.1 Update the Housing Webpage","c)   Ensure that households with disproportionate housing needs are targeted for information through, for example, liaisons with service providers. Ensure targeting reaches ELI households.","12/31/2031","6th Cycle","Continuous","The City continues to update its website to include relevant housing information. This includes translation of key materials.","This objective is targeted ongoing throughout the entire planning period. \n\nThe Housing Division website is located here: https://www.cityofsanmateo.org/501/Housing-and-Neighborhood-Services\n"],["H4.2 Support a Countywide Below Market Rate Unit Waitlist","Support the county’s online portal for a BMR waitlist by transitioning the City’s BMR waiting list to the Countywide system. In addition, work with BMR property managers/owners to advertise available BMR units on the County’s portal to streamline the rental process.","12/31/2031","6th Cycle","Completed","The City merged its affordable rental properties list onto the countywide website (San Mateo County Housing) in January 2023. This transitioned to the regional Doorway website, which completed its rollout in Fall 2024. All new and vacant BMR units in the City are required to be listed on Doorway.","The Doorway website can be found here: https://housingbayarea.mtc.ca.gov/"],["H4.3 Expand Community Education and Outreach","a)   Housing initiatives and policy implementation shall be supported with robust and adaptive community engagement including surveys, workshops, pop-up events, mailings, and targeted outreach to underrepresented groups. Outreach will be conducted biannually.","12/31/2031","6th Cycle","Continuous","a) The City held its annual Housing and Community Needs Assessment in November 2024 to invite community stakeholders and residents to voice their needs and concerns to staff and the Community Relations Commission, which guide funding distribution for the CDBG and PLHA programs. The Community Relations Comimssion also hosted a community workshop on tenant protections and anti-displacement in November 2024. The workshops were held in English with Spanish interpretation, and the staff presentations were provided in English and Spanish. As part of the City's outreach for tenant protections/anti-displacement, staff held focus group meetings and one-on-one meetings with stakeholders. Outreach continued into 2025, including for the City Council study session on April 21, 2025 on anti-displacement/tenant protection policies in the Housing Element.\n","This objective is targeted ongoing throughout the entire planning period."],["H4.3 Expand Community Education and Outreach","b)   Continue to participate in Countywide (and other) efforts to share best practices on equitable engagement and inclusive outreach. (e.g. Home For All “Learning Network”) ","12/31/2031","6th Cycle","Continuous","b) The City continues to participate in countywide efforts and efforts led by the 21 Elements planning collaborative related to engagement and outreach.","This objective is targeted ongoing throughout the entire planning period."],["H4.3 Expand Community Education and Outreach","c)   Actively provide information on County and State resources for tenant protections, discriminatory practices (CC&R's), special needs groups, and households with disproportionate housing needs.","12/31/2031","6th Cycle","Continuous","The City's website contains information/resources for tenants, including City-level resources. ","This objective is targeted ongoing throughout the entire planning period. Some information can be found at: https://www.cityofsanmateo.org/2506/Other-Resources"],["H4.4 Enable Affirmative Marketing","a)   Research other best practices to create an affirmative marketing strategy and implement strategies in San Mateo where appropriate.","12/31/2026","6th Cycle","Not Yet Started","a) The City will research best practices to create an affirmative marketing strategy in 2026.","This objective is targeted ongoing throughout the entire planning period."],["H4.4 Enable Affirmative Marketing","b)   Include farm workers, ELI households, people with disabilities, and households with disproportionate housing needs, and new target group where appropriate.","12/31/2023","6th Cycle","Continuous","b) In Winter 2023, affirmative marketing began for the Kiku Crossing affordable housing project, as focused outreach was used for units aimed at special needs populations through County and local nonprofit organizations.","Affirmative marketing is required for all City below market rate (BMR) units. More detailed marketing plan requirements will be incorporated into the City's BMR Regulatory Agreement and BMR Guidelines as part of the 2026 BMR program update."],["H4.4 Enable Affirmative Marketing","c)   Include Spanish marketing materials and ensure bilingual interpretation services are available. The City will conduct outreach and education on a project-by-project basis and will ensure that programs target/affirmatively market to households in impacted neighborhoods, including North Central and North Shoreview, among others.","12/31/2023","6th Cycle","Continuous","c) Affirmative marketing for the Kiku Crossing affordable housing project included Spanish language materials and targeted outreach. Kiku Crossing was fully occupied at the end of 2024.\n\nStaff has translated most of its tenant-related communications and materials, including those created as part of implementation of Housing Element tenant protection/anti-displacement policies. Emergency Rental Assistance Program information is available in both English and Spanish.","This objective is targeted ongoing throughout the entire planning period."],["H4.4 Enable Affirmative Marketing","d)   Partner with community intermediaries to conduct outreach activities on social media and in the community in Spanish and English language, including events with a significant representation of hard to reach communities such as the annual Dia de los Muertos and Eggstravaganza events (minimum of two per year) as well as pop-ups in the North Central and North Shoreview neighborhoods, (minimum of two per year)","12/31/2025","6th Cycle","Continuous","d) The City continues to maintain a presence conducting outreach in English and Spanish through community events in the North Central and North Shoreview neighborhoods.","The objective is conducted annually."],["H4.5 Conduct Outreach to Sites Inventory Property Owners","Conduct focused outreach to the owners of properties on the Sites Inventory to determine interest in redevelopment or construction of additional housing on their site(s). The outreach shall include provision of information on the City’s development process, fees, and timelines associated with such applications. Initial outreach shall be conducted within two years of adoption and shall be ongoing throughout the housing cycle.","12/31/2023","6th Cycle","Continuous","Staff continues to engage with property owners who have projects in the pipeline or anticipate submitting projects. In 2025, City staff were processing 16 housing development projects (multi-family or mixed use) that had submitted preliminary or formal planning applications for development entitlements. City staff targets quarterly roundtable discussions with developers and property owners.","This objective is targeted ongoing throughout the entire planning period. \n\nCurrent Planning Project Information can be found here and each project page is as needed: https://www.cityofsanmateo.org/1176/Current-Development-Projects\n\nPlanning Division Resource Documents can be found here and updated as needed: https://www.cityofsanmateo.org/1135/Planning-Resource-Documents\n"],["H5.1.1:  Adjust the city's Below Market Rate (inclusionary) program","a)   Perform a feasibility analysis to redesign the program to allow a menu of options, including targeting of units for ELI households.\n","11/30/2023","6th Cycle","In Progress","a) The City has joined with a countywide effort to conduct a nexus study on inclusionary programs to potentially adjust the City's affordability requirements (including targeting ELI units) and to update its fees.  The City has participated in several meetings led by the 21 Elements planning collaborative to draft a joint Request for Proposals (RFP), which is anticipated to be released in 2025. The countywide Grand Nexus Study is anticipated to be completed in 2026. The City anticipates presenting policy options and recommendations for updating the inclusionary ordinance after completion of the Grand Nexus Study.","The Grand Nexus Study, which will include this information, will be posted on the City's website once completed in 2026/27."],["H5.1.1:  Adjust the city's Below Market Rate (inclusionary) program","b)   Ensure analysis includes review of housing for  households with disproportionate housing needs, along with income levels.","5/31/2024","6th Cycle","In Progress","b) The Grand Nexus Study process is underway. It will include analysis of targeting housing for households with disproportionate housing needs, along with income levels.","The Grand Nexus Study, which will include this information, will be posted on the City's website once completed in 2026/27."],["H5.1.2:  Participate in a regional down payment assistance program","a)   Affirmatively market down payment assistance to 1,000 households with disproportionate housing needs, including persons with disabilities, single parents and Hispanic households;\n \n\n\n","12/31/2031","6th Cycle","Completed","a) The City has joined with a County-wide effort with the San Mateo County Housing Endowment and Regional Trust to p
