rovide downpayment assistance for first-time homebuyers. The City will continue to advertise the program to prospective applicants with affirmative marketing strategies.\n\n\n","In progress"],["H5.1.2:  Participate in a regional down payment assistance program","b)   Provide down payment assistance to 30 total households;","12/31/2031","6th Cycle","In Progress","b) The County-wide effort continues to be underway and San Mateo will continue to support the County to meet its goal of providing assistance to 30 total households.","In progress"],["H5.1.2:  Participate in a regional down payment assistance program","c)   Provide homebuyer education to 200 households. ","12/31/2031","6th Cycle","In Progress","c) The County-wide effort continues to be underway and San Mateo will continue to support the county to meet its goal of providing education to 200 total households.","In progress"],["H5.1.2:  Participate in a regional down payment assistance program","d)   Assist households in proportion to the demographic profile of the City. In addition, the City will work with other jurisdictions to conduct outreach and education. Ensure that programs target/affirmatively market to households in impacted neighborhoods, including North Central and North Shoreview, among others. ","12/31/2031","6th Cycle","In Progress","d) The County-wide effort continues to be underway and San Mateo will continue to work towards its goal to affirmatively market the program to impacted neighborhoods.","In progress"],["H5.1.3: Explore the potential to implement a loan program for ADU construction if a City-funded ADU loan program is determined to be infeasible.","Explore the potential for a city ADU loan program. Work with 21 Elements collaborative to design a regional loan forgiveness program. Ensure that programs target/affirmatively market to households in impacted neighborhoods, including North Central and North Shoreview, among others. To enhance mobility in high resource/areas of affluence,  additionally target to areas outside lower resource areas. Target those with disproportionate housing needs, with a goal to reach 5 households annually.\nProvide support to 21 Elements in the development of a countywide ADU forgivable loan program. \nPromote the use of Housing Choice Vouchers (HCVs) for ADUs to allow lower income households the opportunity to live in lower density neighborhoods. The goal is to reach 20% of households with HCVs annually. Provide targeted outreach to ELI households.","12/31/2026","6th Cycle","In Progress","The City is a sponsor of a County-wide collaborative to increase the number of ADUs and in 2024 the San Mateo ADU Resource Center was established to support additional ADU construction. It is anticipated that the ADU Resource Center will explore the potential of a forgivable ADU loan program and a program for housing choice voucher holders to move to areas of high opportunity.","In progress"],["H5.2.1:  Add more city supported housing with affordability restrictions in moderate and high/highest resource areas and areas of affluence.","Require developers to affirmatively market approximately 1,000 units to those with disproportionate housing needs over the eight-year period (approximately 125 annually) by preparing and submitting and affirmative marketing plan to the City for review. The affirmative marketing plan shall include items, such as advertising (print, social media) and targeting community organizations that serve households with disproportionate housing needs. Ensure that programs target/affirmatively market to households with disproportionate housing needs. Of the 1,000 affordable units, approximately 15% will benefit special needs and/or ELI households.\nContinue to update the housing inventory and provide on the City’s website so that developers can target housing in moderate and high opportunity areas, as well as areas of affluence. ","12/31/2025","6th Cycle","In Progress","In Winter 2023, affirmative marketing began for the Kiku Crossing affordable housing project as focused outreach was used for units aimed at special needs populations through County and local nonprofit organizations. Kiku Crossing is located in a Highest Resource area defined by the 2024 TCAC Opportunity maps.  \n\nIn Fall/Winter 2024, the City worked with MidPen Housing on an affirmative marketing plan for vacant units at 2000 S. Delaware, a formerly moderate-income affordable housing development on City-owned land that was acquired by MidPen Housing in 2024 and converted to a low-income (80% AMI) housing development, with a City loan of $500,000. Application processing continued into 2025. 2000 S. Delaware is located in a High Resource area as defined by the 2024 TCAC Opportunity Map.","The objective is conducted annually. MidPen submitted affirmative marketing plans for the City's approval for both Kiku Crossing and 2000 S. Delaware and worked with the City to reach individuals with disproportionate housing needs. "],["H5.2.2:  Incentivize developers through direct subsidies, fee waivers, and/or density bonuses, to increase accessibility requirements beyond the federal requirement","a)   Update development agreements for projects with City subsidies to include additional accessible units.\n\n","12/31/2023","6th Cycle","Continuous","a) The Kiku Crossing affordable housing project, which was completed and reached full occupancy in 2024, contains 22 units for formerly homeless households and 8 units for individuals with intellectual and developmental disabilities.\n\n","This objective is targeted ongoing throughout the entire planning period. "],["H5.2.2:  Incentivize developers through direct subsidies, fee waivers, and/or density bonuses, to increase accessibility requirements beyond the federal requirement","b)   Update the City’s Inclusionary Housing Policy to require projects that receive City subsidies to increase the percentage of units that meet accessibility requirements.","12/31/2026","6th Cycle","Not Yet Started","b) The City anticipates presenting policy options and recommendations for updating the inclusionary ordinance to City Council in 2026.","This will be part of the comprehensive update to the City's Below Market-Rate policy in 2026."],["H5.2.2:  Incentivize developers through direct subsidies, fee waivers, and/or density bonuses, to increase accessibility requirements beyond the federal requirement","c)   The City will proactively outreach to developers throughout the planning period every two years, beginning in 2024.","12/31/2026","6th Cycle","Continuous","c) The City will continue to proactively outreach to developers to increase accessibility for upcoming projects, such as the Bespoke mixed-use development, which includes a standalone affordable housing development.","This objective is targeted to be completed every two years."],["H5.2.3:  Prioritize city funding proposals for city funded affordable housing that are committed to serving hard to serve residents","Conduct a best practices review and develop a program to prioritize City funding for housing projects. ","12/31/2028","6th Cycle","Not Yet Started","In 2023, the City prioritized Permanent Local Housing Allocation funding for the St James Supportive Housing project which will provide all of its units to ELI households to transition-aged former foster youth. Staff will conduct a review of best practices for funding prioritization and develop a program for City Council adoption by 2028. ","Not yet started, though PLHA funding was directed to predevelopment of 5 ELI units at the St. James New Beginnings project. "],["H5.2.4:  Develop a housing mobility program that provides support to tenants seeking to move to high opportunity areas","There will be a 20% increase in the number of voucher holders, including ELI households, moving to areas of high opportunity.  ","12/31/2023","6th Cycle","Not Yet Started","Staff will collaborate with the County to develop a housing mobility program to explore options for housing choice voucher holders to move to areas of high opportunity, such as through an ADU program.","This objective is targeted ongoing throughout the entire planning period. As noted elsewhere,  it is anticipated that the countywide ADU Resource Center will explore the potential of a forgivable ADU loan program and a program for housing choice voucher holders to move to areas of high opportunity."],["H5.3.1:  Conduct an area plan for the North Shoreview and North Central neighborhoods","Prepare an area plan for North Shoreview and North Central neighborhoods.","12/31/2029","6th Cycle","Not Yet Started","Staff will continue to complete this plan through the larger General Plan Update implementation plan. The development of North Shoreview and North Central area plans are expected to be completed in 2029 in accordance with the Complete Streets Plan of the Public Works Department.","Not yet started"],["H5.3.2:  Continue to fund minor home repairs, infrastructure improvements and public services","Complete annual goals of 10 minor home repairs and 14 accessibility modifications through grants for low-income residents. Provide home rehabilitation loans for low- income homeowners and landlords making accessibility modifications. Fund service providers that target households with disproportionate housing needs, including services for seniors, ELI households, youth, and fair housing. \nAffirmatively market to Hispanic and single female heads of household biannually; ensure that programs target/affirmatively market to households in impacted neighborhoods, including North Central and North Shoreview, among others. \nBi-annually apply for funding through the CIP or other actions to address infrastructure needs.","12/31/2023","6th Cycle","In Progress","a) In 2025: 2 minor home repair projects were completed.","The objective is conducted annually. Minor home repair programs are funded by the Community Development Block Grant (CDBG). The City did not receive its entitlement amount for the 25-26 program year because it has not executed a Grant Ageement with the US Department of Housing and Urban Development (HUD). This affects July-December 2025 and is the main reason for the failure to meet the target of 10 projects. "],["H5.3.3:  Monitor affordable housing projects that are at risk of conversion to market rate.","Bridgepointe Condominiums affordability requirements for 59 affordable units expire in 2027, out of which 24 are very low- income units (35 are at 120% AMI). Belmont Building affordability requirements for 6 units expire in 2032. The rental property is owned by a for-profit entity, potential for loss of units is high. \nProactively coordinate with owners to preserve the 24 very low- income units as affordable, including identifying potential funding sources, advertise conversion units to non-profits, provide conduct tenant outreach and education, add a displacement preference for new affordable housing for people displaced, including those displaced as a result of conversion. Provide noticing to tenants and affected public entities in accordance with Gov. Code, § 65863.10, 65863.11, and 65863.13 Outreach and negotiate with owners for affordability extensions beginning at least two years prior to the affordability expiration date. ","12/31/2027","6th Cycle","Not Yet Started","a) The Bridgepointe Condominiums were identified as a priority to address. Their affordability requirements for 24 low-income units will expire in 2027. Options such as using funding sources to purchase or advertising conversion units to non-profits are being explored.\n","Not yet started. Work on this began in 2026 and will be reported on in the following APR."],["H5.3.3:  Monitor affordable housing projects that are at risk of conversion to market rate.","Bridgepointe Condominiums affordability requirements for 59 affordable units expire in 2027, out of which 24 are very low- income units (35 are at 120% AMI). Belmont Building affordability requirements for 6 units expire in 2032. The rental property is owned by a for-profit entity, potential for loss of units is high. \nProactively coordinate with owners to preserve the 24 very low- income units as affordable, including identifying potential funding sources, advertise conversion units to non-profits, provide conduct tenant outreach and education, add a displacement preference for new affordable housing for people displaced, including those displaced as a result of conversion. Provide noticing to tenants and affected public entities in accordance with Gov. Code, § 65863.10, 65863.11, and 65863.13 Outreach and negotiate with owners for affordability extensions beginning at least two years prior to the affordability expiration date. ","1/31/2032","6th Cycle","Not Yet Started","b) Belmont Building affordability requirements for 6 low-income units expire in 2032. Staff will proactively reach out to owners to extend affordability and mitigate displacement.","Not yet started"],["H5.4.1:  Establish tenant protections in local ordinance to extend measures of AB1482","a)   Extend AB1482 provisions to require tenant relocation payments for No Fault evictions for those with tenure less than one year.\n","12/31/2024","6th Cycle","Completed","a) The City Council adopted an ordinance on November 17, 2025 that extended those provisions of AB 1482 to tenants with a tenure of 11 months or longer. \n\n","See above for ordinance"],["H5.4.1:  Establish tenant protections in local ordinance to extend measures of AB1482","b)   Make recommendations to the City Council for establishing tenant protection policies that include the requirement of documentation from landlords who use the substantial remodel exemption to evict tenants and a Right to Return policy for tenants displaced from homes due to demolition or substantial remodels.","12/31/2026","6th Cycle","Completed","b) This was incorporated into the study session on April 21, 2025 on anti-displacement/tenant protection policies in the Housing Element and the ordinance that was adopted on November 17, 2025.","See above for ordinance"],["H5.4.1:  Establish tenant protections in local ordinance to extend measures of AB1482","c)   Amend the Code to strengthen enforcement penalty structure to aid in protecting tenants from unsafe or substandard units. ","12/31/2024","6th Cycle","Completed","c) This was incorporated into the study session on April 21, 2025 on anti-displacement/tenant protection policies in the Housing Element and the ordinance that was adopted on November 17, 2025..","See above for ordinance"],["H5.4.2:  Partner with Project Sentinel to perform fair housing training for landlords and tenants","Provide annual funding to Project Sentinel to provide training every two years in the Spring, targeting 200 landlords each training. Awareness will be increased through outreach to landlords.","12/31/2025","6th Cycle","Continuous","In 2025: Project Sentinel held two Fair Housing workshops in San Mateo.","The objective is conducted annually."],["H5.4.3:  Create a webpage specific to fair housing","Provide information on the City's website about housing discrimination, laws, and protections. Fair Housing resources will also be advertised on the City’s eNewsletter, social media channels and various email listservs. Update the webpage every two years, along with other transparency updates.","12/31/2026","6th Cycle","Continuous","The City maintains a Fair Housing webpage at https://www.cityofsanmateo.org/3764/Fair-Housing-Assessment and will continue to update it with new resources for residences experiencing discrimination while evaluating it for accessibility to resolve any gaps.","This objective is targeted to be completed each two years. The City maintains a Fair Housing webpage at https://www.cityofsanmateo.org/3764/Fair-Housing-Assessment"],["H5.4.4:  All multi-family residential developments contain signage in both English and Spanish to explain the right to request reasonable accommodations for persons with disabilities.","Initially, create ongoing condition of approval to ensure both BMR and all-affordable developments contain this information. Explore options for recording against the property and/or including in the affordable housing agreement.","12/31/2026","6th Cycle","Not Yet Started","The City continues to monitor multi-family developments to ensure appropriate signage for fair housing is displayed in common areas and information is provided in English and Spanish. The City has joined a County-wide BMR workgroup in to review best practices for BMR management in 2024.","Not yet started"],["H5.4.5:  Ensure that future improvements in disadvantaged communities will not produce a net loss of affordable housing or the displacement of residents","In conjunction with Policies 5.3.1, and 5.3.2, when improvements are planned to be made to disadvantaged communities, conduct a review of existing housing units that may be impacted by such improvements. Consistent with H2.6, ensure units that may be lost are replaced.","12/31/2027","6th Cycle","Not Yet Started","Staff will continue to complete this policy through the larger General Plan Update and implementation of state laws that requires no-net loss of units. The development of a no-net-loss affordable housing policy is expected to be completed in 2027.","Not yet started"]];

              dateWrap.append(opSel).append(dateA).append(dateB);
              (function(opSel,dateA,dateB,column,colIdx,nTableId){

                function toDateMs(s){if(!s)return NaN;var ms,y,m,d;var iso=s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);if(iso){ms=Date.parse(iso[1]+'-'+iso[2]+'-'+iso[3]);if(!isNaN(ms))return ms;}var parts=s.match(/(\d{1,2})\D+(\d{1,2})\D+(\d{2,4})/);if(parts){var a=parts[1],b=parts[2],c=parts[3];if(colOrder===1){d=a;m=b;y=c;}else if(colOrder===0){m=a;d=b;y=c;}else{y=a;m=b;d=c;}if(y.length===2){y=(parseInt(y,10)<=29?'20':'19')+y;}ms=Date.parse(y+'-'+m+'-'+d);if(!isNaN(ms))return ms;}ms=Date.parse(s);return isNaN(ms)?NaN:ms;}
                opSel.on('change',function(){if($(this).val()==='..'){dateB.show();}else{dateB.hide().val('');}if($(this).val()===''){dateA.val('');dateB.val('');}column.draw();});
                $.fn.dataTable.ext.search.push(function(settings,row){if(settings.nTable.id!==nTableId)return true;var op=opSel.val(),a=dateA.val();if(!op||!a)return true;var cell=row[colIdx];if(cell===''||cell===null||cell===undefined)return true;var cellMs=toDateMs(cell);if(isNaN(cellMs))return false;var aMs=Date.parse(a+'T00:00:00');if(op==='=')return cellMs>=aMs&&cellMs<=Date.parse(a+'T23:59:59');if(op==='>=')return cellMs>=aMs;if(op==='>')return cellMs>Date.parse(a+'T23:59:59');if(op==='<=')return cellMs<=Date.parse(a+'T23:59:59');if(op==='<')return cellMs<aMs;if(op==='..'){var b=dateB.val();return cellMs>=aMs&&cellMs<=(b?Date.parse(b+'T23:59:59'):Infinity);}return true;});
                dateA.on('change',function(){column.draw();});dateB.on('change',function(){column.draw();});
              })(opSel,dateA,dateB,column,colIdx,nTableId);

            } else if (isNumeric) {

              var pn=function(v){var s=v.toString().replace(/[^0-9.,\s\-]/g,'');if(THOUSANDS_SEP)s=s.split(THOUSANDS_SEP).join('');if(DECIMAL_SEP!=='.')s=s.replace(DECIMAL_SEP,'.');return parseFloat(s);};
              var nums=nonEmpty.map(pn).filter(function(n){return isFinite(n);});
              var hint=nums.length>=2?'>'+Math.min.apply(null,nums)+' <'+Math.max.apply(null,nums):'>min <max';
              var exprInput=$('<input type="text" class="form-control form-control-sm text-end" style="width:100%">');
              exprInput.attr('placeholder',hint).attr('title','Use >, <, >=, <=, = operators or semicolons for multiple values');
              (function(exprInput,column,colIdx,nTableId){
                function parseNum(s){if(s===undefined||s===null||s==='')return NaN;s=s.toString().replace(/[^0-9.,\s-]/g,'');if(THOUSANDS_SEP)s=s.split(THOUSANDS_SEP).join('');if(DECIMAL_SEP!=='.')s=s.replace(DECIMAL_SEP,'.');return parseFloat(s);}
                function parseExpr(expr){var conditions=[],multiVals=[];var regex=/(>=|<=|>|<|=)\s*([0-9.,\s-]+)/g;var m;while((m=regex.exec(expr))!==null){conditions.push({op:m[1],val:parseNum(m[2])});}if(conditions.length===0&&expr.trim()!==''){expr.split(';').forEach(function(part){var n=parseNum(part.trim());if(!isNaN(n))multiVals.push(n);});}return{conditions:conditions,multiVals:multiVals};}
                $.fn.dataTable.ext.search.push(function(settings,row){if(settings.nTable.id!==nTableId)return true;var expr=exprInput.val().trim();if(expr==='')return true;var parsed=parseExpr(expr);if(parsed.conditions.length===0&&parsed.multiVals.length===0)return true;var val=parseNum(row[colIdx]);if(isNaN(val))return false;if(parsed.multiVals.length>0)return parsed.multiVals.indexOf(val)!==-1;return parsed.conditions.every(function(c){switch(c.op){case'>':return val>c.val;case'<':return val<c.val;case'>=':return val>=c.val;case'<=':return val<=c.val;case'=':return val===c.val;default:return true;}});});
                exprInput.on('keyup change',function(){column.draw();});

              dropdown.append(btn).append(menu);
              btn.on('click',function(e){e.stopPropagation();if(!menu.hasClass('show')){var btnPos=btn[0].getBoundingClientRect();menu.appendTo('body').css({position:'fixed',top:btnPos.bottom+'px',left:btnPos.left+'px',width:Math.max(btnPos.width,200)+'px'}).addClass('show');}else{menu.removeClass('show').appendTo(dropdown);}});
              (function(menu,btn,column,colIdx,checkedVals,allSelected,nTableId,saId){
                $.fn.dataTable.ext.search.push(function(settings,searchData,dataIndex,rowData){if(settings.nTable.id!==nTableId)return true;if(allSelected)return true;return checkedVals.has(rowData[colIdx]);});
                function updateFilter(){var checked=menu.find('input[type="checkbox"]:not(#'+saId+'):checked');var total=menu.find('input[type="checkbox"]:not(#'+saId+')').length;checkedVals.clear();checked.each(function(){checkedVals.add($(this).val());});allSelected=(checked.length===total);if(checked.length===0){btn.find('.btn-text').html('None');}else if(allSelected){btn.find('.btn-text').html('All');}else{btn.find('.btn-text').html(checked.length+' selected');}selectAllItem.find('input').prop('checked',allSelected).prop('indeterminate',checked.length>0&&!allSelected);column.draw();}
                menu.find('input[type="checkbox"]:not(#'+saId+')').on('change',updateFilter);selectAllItem.find('input').on('change',function(){menu.find('input[type="checkbox"]:not(#'+saId+')').prop('checked',$(this).prop('checked'));updateFilter();});
              })(menu,btn,column,colIdx,checkedVals,allSelected,nTableId,saId);
              th.append(dropdown);
            }
          });
          if(!window._tpDocClickBound){window._tpDocClickBound=true;$(document).on('click',function(e){$('.multiselect-dropdown').each(function(){var dd=$(this),m=dd.find('.dropdown-menu').add($('body > .dropdown-menu'));if(!dd.is(e.target)&&dd.has(e.target).length===0&&!m.is(e.target)&&m.has(e.target).length===0){m.filter('.show').removeClass('show').appendTo(dd);}});});}
